<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title | default: "Etonia" }}</title>
  <link rel="icon" type="image/png" href="assets/etonia.png" />
  <link rel="apple-touch-icon" href="assets/etonia.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFF9ED;
      --surface: #FFFDF8;
      --surface-muted: #FBF1DE;
      --text-primary: #2C2C2C;
      --text-secondary: #5E5A52;
      --divider: #EFE3CC;
      --border-strong: #D6C6A4;
      --accent: #FFE200;
      --brand-subtle: #FFF6C2;
      --fold: #F9E6C5;
      --lilac: #FAE6FF;
      --sprout: #2E8B4F;
      --canvas-dot: #E8DAB9;
      --shadow-paper:
        0 1px 2px rgba(27, 26, 31, 0.04),
        0 3px 8px -1px rgba(27, 26, 31, 0.06);
      --shadow-floating:
        0 2px 4px rgba(27, 26, 31, 0.05),
        0 10px 24px -4px rgba(27, 26, 31, 0.09);
      --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-primary);
      background-color: var(--bg);
      background-image: radial-gradient(var(--canvas-dot) 1.3px, transparent 1.3px);
      background-size: 20px 20px;
      background-position: 10px 10px;
      padding: 20px 16px 56px;
      -webkit-font-smoothing: antialiased;
    }

    .legal-shell {
      max-width: 820px;
      margin: 0 auto;
    }

    .legal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px 16px;
      margin-bottom: 24px;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid var(--divider);
      border-radius: 16px;
      box-shadow: var(--shadow-floating);
    }

    .legal-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .legal-brand-tile {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--lilac);
      border: 1px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .legal-nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .legal-nav a {
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background-color 150ms ease;
    }

    .legal-nav a:hover {
      background: var(--surface-muted);
    }

    .legal-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: 22px;
      padding: 40px 44px;
      box-shadow: var(--shadow-paper);
    }

    .legal-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 36px;
      background: linear-gradient(225deg, var(--bg) 48%, var(--border-strong) 49%, var(--fold) 51%);
      border-bottom-left-radius: 10px;
      border-top-right-radius: 22px;
      pointer-events: none;
    }

    .legal-content h1 {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 600;
      line-height: 1.16;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--divider);
    }

    .legal-content h2 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-primary);
      margin-top: 28px;
      margin-bottom: 10px;
    }

    .legal-content p {
      margin-bottom: 14px;
      color: var(--text-primary);
    }

    .legal-content ul,
    .legal-content ol {
      margin: 0 0 16px 22px;
    }

    .legal-content li {
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .legal-content strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .legal-content code {
      font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      font-size: 0.9em;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--surface-muted);
      border: 1px solid var(--divider);
      color: var(--text-primary);
    }

    .legal-content a {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--border-strong);
      text-underline-offset: 3px;
    }

    .legal-content a:hover {
      background: var(--brand-subtle);
      text-decoration-color: var(--text-primary);
    }

    .legal-footer {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13.5px;
      color: var(--text-secondary);
      padding: 0 6px;
    }

    .legal-footer a {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .legal-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="legal-shell">
    <header class="legal-header">
      <a href="./" class="legal-brand" aria-label="Etonia Support">
        <span class="legal-brand-tile" aria-hidden="true">
          <!-- Tonia vector mark (lib/shared/widgets/etonia_mark.dart) -->
          <svg viewBox="0 0 100 100" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(48, 12) rotate(35.52)">
              <rect x="-2" y="0" width="48" height="10" rx="3.5" fill="#FFDB3A" stroke="#2C2C2C" stroke-width="4.2" stroke-linejoin="round" />
              <path d="M 45 0.2 L 56 5.0 L 45 9.8 Q 43.5 7.2 45 5.0 Q 43.5 2.8 45 0.2 Z" fill="#F9E6C5" stroke="#2C2C2C" stroke-width="4.2" stroke-linejoin="round" />
              <path d="M 52 3.2 L 56 5.0 L 52 6.8 Z" fill="#2C2C2C" />
            </g>
            <path d="M 17 23 Q 39.5 21 62 23 L 77 38 Q 79 64.5 77 91 Q 77 95 73 95 Q 45 97 17 95 Q 13 95 13 91 Q 11 59 13 27 Q 13 23 17 23 Z" fill="#FFF9ED" stroke="#2C2C2C" stroke-width="4.2" stroke-linejoin="round" />
            <path d="M 62 23 Q 60.5 39.5 77 38 Z" fill="#F9E6C5" stroke="#2C2C2C" stroke-width="3.2" stroke-linejoin="round" />
            <path d="M 34 49 Q 32.5 59 34.5 69" fill="none" stroke="#2C2C2C" stroke-width="4.2" stroke-linecap="round" />
            <path d="M 54 49 Q 52.5 59 54.5 69" fill="none" stroke="#2C2C2C" stroke-width="4.2" stroke-linecap="round" />
            <line x1="42" y1="79" x2="43.2" y2="84" stroke="#2C2C2C" stroke-width="4.2" stroke-linecap="round" />
            <path d="M 46.5 11.5 Q 38 10 36.5 3.5 Q 43 2.5 46.5 11.5 Z M 46.5 11.5 Q 45 3 51.5 1.5 Q 54 7.5 46.5 11.5 Z" fill="#93D391" stroke="#2E8B4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span>Etonia</span>
      </a>

      <nav class="legal-nav" aria-label="Legal and support navigation">
        <a href="./">Support</a>
        <a href="privacy">Privacy Policy</a>
        <a href="terms">Terms of Use</a>
      </nav>
    </header>

    <main class="legal-card">
      <article class="legal-content">
        {{ content }}
      </article>
    </main>

    <footer class="legal-footer">
      <span>&copy; 2026 Etonia &middot; Made by Mu-En Lee</span>
      <span>
        <a href="mailto:limuen.allen@gmail.com">limuen.allen@gmail.com</a>
      </span>
    </footer>
  </div>
</body>
</html>
